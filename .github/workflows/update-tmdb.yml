name: Atualizar catálogo TMDB

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 1 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buscar pôsteres, sinopses e trailers
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/fetch-tmdb.mjs
      - name: Publicar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmdb-data.json
          git diff --cached --quiet || git commit -m "Atualiza catálogo visual TMDB"
          git push
